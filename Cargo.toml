[workspace]
resolver = "3"
members = ["crates/eltq-core", "crates/eltq-python"]

[workspace.package]
version = "1.3.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
thiserror = "2"
statrs = "0.18"
csv = "1.4"
pyo3 = "0.29"
numpy = "0.29"

[profile.release]
lto = "thin"
codegen-units = 1

# Numerical tests hammer the inverse-beta kernel; unoptimized they crawl.
[profile.test]
opt-level = 2
