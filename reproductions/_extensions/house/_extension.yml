title: House
author: Stephen J. Mildenhall
# The single source of the kit's version. Each installed copy carries it, and
# tools\check-house.ps1 compares every copy under D:\Projects against this one.
version: 1.18.0
quarto-required: ">=1.10.0"
contributes:
  formats:
    # A document writes `format: house-pdf`, `house-html` or `house-beamer`;
    # `house-latex` writes a house-pdf render's LaTeX without compiling it.
    # Anything set here is a default: a project's _quarto.yml, a profile, or a
    # document's front matter overrides it.
    common:
      # The house citation style, an independent style the kit owns, so a
      # render fetches nothing. A project or document overrides it with its
      # own `csl:`, as a journal submission does.
      csl: house.csl
      # One highlight theme colors every language in the aggregate Loss Lab
      # palette, so Python and DecL share it on the page, on a slide and on
      # the web.
      highlight-style: house.theme
      # A ```decl fence is colored by this syntax definition, generated by
      # tools\gen_decl_xml.py so that DecL is classed exactly as aLL classes it.
      syntax-definitions:
        - decl.xml
      # Bold headers on markdown pipe tables in PDF and on slides. The filter
      # does nothing in HTML, where the theme already bolds <th>. On slides,
      # columns span the text width exactly, as one column does; that filter
      # acts only on beamer.
      filters:
        - bold-table-headers.lua
        - columns-text-width.lua

    # The anchor lets `house-latex` (below) carry exactly these settings.
    pdf: &house-pdf
      pdf-engine: tectonic
      # Without --print tectonic swallows the TeX engine's own message, and
      # -Zcontinue-on-errors reports every LaTeX error in one pass instead of
      # stopping at the first.
      pdf-engine-opts:
        - --print
        - -Zcontinue-on-errors

      # The page: A4, 11pt, 2.5cm margins all round, one sided, which gives a
      # text block 16.0cm (455pt) wide. scrartcl is the default because the
      # house preamble needs a KOMA class; a book sets scrreprt in its own
      # _quarto.yml, which has no blank pages before chapters on screen.
      documentclass: scrartcl
      papersize: a4
      fontsize: 11pt
      geometry:
        - margin=2.5cm
      fig-pos: H
      # A figure is half the text width by default, house.figsize('half'),
      # and house.figure() gives the three-quarter and full sizes and rows of
      # panels. The house style for matplotlib carries no size of its own.
      fig-width: 3.02
      fig-height: 2.16

      # The fonts, all from tectonic's bundle and none from the system, so a
      # document renders the same on any machine. Named by file, because a
      # family name is looked up among the system fonts. STIX Two Text and
      # STIX Two Math are drawn as a matched pair for scientific work. Lato is
      # the heading face, with its Semibold as the bold, and slides use the
      # same four faces. DejaVu Sans Mono is scaled to the text face's
      # lowercase height, so code set inline does not stand taller than the
      # words around it.
      mainfont: STIXTwoText-Regular.otf
      mainfontoptions:
        - BoldFont=STIXTwoText-Bold.otf
        - ItalicFont=STIXTwoText-Italic.otf
        - BoldItalicFont=STIXTwoText-BoldItalic.otf
      sansfont: Lato-Regular.ttf
      sansfontoptions:
        - BoldFont=Lato-Semibold.ttf
        - ItalicFont=Lato-Italic.ttf
        - BoldItalicFont=Lato-SemiboldItalic.ttf
      mathfont: STIXTwoMath-Regular.otf
      monofont: DejaVuSansMono.ttf
      monofontoptions:
        - Scale=MatchLowercase
        - BoldFont=DejaVuSansMono-Bold.ttf
        - ItalicFont=DejaVuSansMono-Oblique.ttf
        - BoldItalicFont=DejaVuSansMono-BoldOblique.ttf

      include-in-header:
        - house-common.tex
        - house.tex

    # The LaTeX a house-pdf render compiles, written out and not compiled, for
    # chasing a LaTeX error. A book cannot keep-tex, so its render script adds
    # this format through a profile. The same settings as pdf, by the anchor,
    # so the two cannot drift.
    latex: *house-pdf

    html:
      # The web page takes the house's code, DecL, table and figure treatment
      # (the theme, decl.xml and the Python side come from `common` and from
      # house.py) and nothing else. No Bootstrap theme and no fonts: those stay
      # with each project, so a note headed for the blog keeps the blog's look.
      fig-width: 3.02
      fig-height: 2.16
      # Long code lines wrap, as they break in PDF, rather than scroll.
      code-overflow: wrap

    beamer:
      pdf-engine: tectonic
      pdf-engine-opts:
        - --print
        - -Zcontinue-on-errors

      # The canvas, from aggregate\presentations. Beamer sets \paperwidth and
      # \paperheight from `aspectratio` and every theme dimension follows; no
      # \geometry anywhere, and no documentclass, papersize or geometry key
      # here, each of which breaks the canvas in its own way. 2817 is 28:17,
      # the old 14 x 8.5in legal landscape page. `t` top-aligns frame content.
      classoption:
        - t
        - aspectratio=2817
      # Beamer declares only 8/9/10/11/12/14/17/20pt and silently ignores the
      # rest.
      fontsize: 11pt
      slide-level: 2
      number-sections: false
      toc: false

      # The look: metropolis inner and outer themes, the orchid colors, bold
      # structure, and the house red set in house-beamer.tex. The metropolis
      # themes were drawn for Fira Sans; the house sets them in its own faces.
      innertheme: metropolis
      outertheme: metropolis
      colortheme: orchid
      fonttheme: structurebold

      # The document fonts: text and mathematics in STIX Two, headings in
      # Lato. Naming a main font makes pandoc's template switch beamer to the
      # serif font theme, so text and math are serif; house-beamer.tex sets
      # the title, frame titles, section pages and block titles in the sans.
      # Those headings are bold structure, and bold in Lato is mapped to its
      # Semibold. All from tectonic's bundle, named by file.
      mainfont: STIXTwoText-Regular.otf
      mainfontoptions:
        - BoldFont=STIXTwoText-Bold.otf
        - ItalicFont=STIXTwoText-Italic.otf
        - BoldItalicFont=STIXTwoText-BoldItalic.otf
      sansfont: Lato-Regular.ttf
      sansfontoptions:
        - BoldFont=Lato-Semibold.ttf
        - ItalicFont=Lato-Italic.ttf
        - BoldItalicFont=Lato-SemiboldItalic.ttf
      mathfont: STIXTwoMath-Regular.otf
      monofont: DejaVuSansMono.ttf
      monofontoptions:
        - Scale=MatchLowercase
        - BoldFont=DejaVuSansMono-Bold.ttf
        - ItalicFont=DejaVuSansMono-Oblique.ttf
        - BoldItalicFont=DejaVuSansMono-BoldOblique.ttf

      # Two link colors, defined in house-beamer.tex: the section dividers are
      # links and must stay red (smcolor), while what a reader recognizes as a
      # link, a URL or a citation, takes the contrasting slate blue (agglink).
      colorlinks: true
      linkcolor: agglink
      urlcolor: agglink
      citecolor: agglink
      filecolor: smcolor
      # The bibliography reads as end matter, not a wall of colored links; its
      # size is set in house-beamer.tex.
      link-bibliography: false
      link-citations: true
      # Pandoc sizes a pipe table from the width of its source lines, and over
      # this many characters stretches it across the slide with p{} columns.
      # The default of 72 is crossed by an ordinary six-column table.
      columns: 120

      # The frame's text block, measured on this canvas at 381.6pt (5.3in)
      # wide; house.py holds the same measure as the slide table budget. A
      # 2.9in figure overfilled the frame under its title by 31pt, so the
      # height is what fits there.
      fig-width: 5.3
      fig-height: 2.4

      include-in-header:
        - house-common.tex
        - house-beamer.tex
