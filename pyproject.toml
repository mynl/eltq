[project]
name = "eltq"
version = "1.6.0"
description = "Ferociously fast ELT secondary-uncertainty quantization"
requires-python = ">=3.13"
dependencies = ["numpy>=2.1"]

# maturin (not hatchling): the package is a Rust extension; agreed in
# dev/plan-implementation.md.
[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "crates/eltq-python/Cargo.toml"
python-source = "python"
module-name = "eltq._eltq"

[tool.uv]
# Rebuild the extension when Rust sources change, not just pyproject.toml.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "crates/**/Cargo.toml" },
    { file = "crates/**/*.rs" },
]

[dependency-groups]
dev = [
    "pytest>=8",
    "scipy>=1.14",
    "pandas>=2.2",
    "maturin>=1.7,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
